<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Kasir & Stok</title>
    <style type="text/css">
        body {
            font-family: Arial, sans-serif;
            background-color: #0a9a57;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background-color: rgb(1, 69, 49);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .login-card h1 {
            text-align: center;
            color: #8f8256;
            margin-bottom: 1rem;
        }

        .login-card h2 {
            text-align: center;
            color: #8f8256;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
            color: #fff;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 90%;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid #000000;
        }

        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            background-color: #177d37;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #4b0d01;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <h1>Cashere</h1>
        <h2>Login </h2>
        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>
            <button type="submit" class="btn-primary">Masuk</button>
        </form>
    </div>

    <script src="jscript.js"></script>
</body>
</html>
